name: Deploy app versions to GitHub Pages

on:
  push:
    branches:
      - master
      - design-proposal-1
      - design-proposal-2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout current app branch
        uses: actions/checkout@v6
        with:
          ref: master
          path: current

      - name: Checkout design proposal 1 branch
        uses: actions/checkout@v6
        with:
          ref: design-proposal-1
          path: proposal1

      - name: Checkout design proposal 2 branch
        uses: actions/checkout@v6
        with:
          ref: design-proposal-2
          path: proposal2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies for current app
        working-directory: current
        run: pnpm install --frozen-lockfile

      - name: Generate data for current app
        working-directory: current
        run: pnpm generate:data

      - name: Build current app
        working-directory: current
        run: VITE_BASE="/${REPO_NAME}/" pnpm build

      - name: Install dependencies for design proposal 1
        working-directory: proposal1
        run: pnpm install --frozen-lockfile

      - name: Generate data for design proposal 1
        working-directory: proposal1
        run: pnpm generate:data

      - name: Build design proposal 1
        working-directory: proposal1
        run: VITE_BASE="/${REPO_NAME}/design-proposal/1" pnpm build

      - name: Install dependencies for design proposal 2
        working-directory: proposal2
        run: pnpm install --frozen-lockfile

      - name: Generate data for design proposal 2
        working-directory: proposal2
        run: pnpm generate:data

      - name: Build design proposal 2
        working-directory: proposal2
        run: VITE_BASE="/${REPO_NAME}/design-proposal/2" pnpm build

      - name: Combine all builds into one Pages site
        run: |
          mkdir -p published-site/design-proposal-1

          cp -a current/dist/. published-site/
          cp -a proposal1/dist/. published-site/design-proposal/1/
          cp -a proposal2/dist/. published-site/design-proposal/2/

          touch published-site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
